[binaries]
c       = ['clang', '--target=aarch64-none-elf']
rust    = ['rustc', '--target=aarch64-unknown-none-softfloat']
rust_ld = ['clang', '--target=aarch64-none-elf', '-fuse-ld=lld', '-nostdlib']
ar      = 'llvm-ar'
strip   = 'llvm-strip'
objcopy = 'llvm-objcopy'

[properties]
needs_exe_wrapper = true

[host_machine]
system     = 'none'
kernel     = 'none'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'
