name: release

on:
  push:
    branches:
      - master
      - main
    paths:
      - meson.build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      MUSL_TOOLCHAIN_PRIMARY_URL: https://github.com/cross-tools/musl-cross/releases/download/20260515/aarch64-unknown-linux-musl.tar.xz
      MUSL_TOOLCHAIN_FALLBACK_URL: https://musl.cc/aarch64-linux-musl-cross.tgz
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read Meson version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - meson.build <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text()
          match = re.search(r"project\s*\([^)]*version\s*:\s*['\"]([^'\"]+)['\"]", text, re.S)
          if not match:
              sys.exit("meson.build project() version not found")
          print(match.group(1))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this is a version bump
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          meson_version_from_file() {
            python3 - "$1" <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(sys.argv[1]).read_text()
          match = re.search(r"project\s*\([^)]*version\s*:\s*['\"]([^'\"]+)['\"]", text, re.S)
          print(match.group(1) if match else "")
          PY
          }

          tag='${{ steps.version.outputs.tag }}'
          version='${{ steps.version.outputs.version }}'
          git fetch --force --tags origin '+refs/tags/*:refs/tags/*'
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; no release to create."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ '${{ github.event_name }}' = 'push' ]; then
            before='${{ github.event.before }}'
            if [ -n "$before" ] && git cat-file -e "$before:meson.build" 2>/dev/null; then
              git show "$before:meson.build" > "$RUNNER_TEMP/previous-meson.build"
              previous="$(meson_version_from_file "$RUNNER_TEMP/previous-meson.build")"
              if [ "$previous" = "$version" ]; then
                echo "meson.build changed, but project version is still $version; no release to create."
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Install host dependencies
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang cmake curl dosfstools e2fsprogs \
            file lld llvm make mtools ninja-build perl pkg-config python3-venv qemu-system-arm \
            xz-utils zip

      - name: Install Meson
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/pip" install meson==1.10.1
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Restore musl toolchain cache
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/cache@v5
        with:
          path: .ci-cache/musl
          key: ${{ runner.os }}-aarch64-musl-cross-v2

      - name: Install aarch64 musl cross toolchain
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$GITHUB_WORKSPACE/.ci-cache/musl"

          has_toolchain() {
            [ -x "$toolchain/bin/aarch64-unknown-linux-musl-gcc" ] ||
              [ -x "$toolchain/bin/aarch64-linux-musl-gcc" ]
          }

          unpack_toolchain() {
            url="$1"
            archive="$RUNNER_TEMP/musl-toolchain.archive"
            unpack="$RUNNER_TEMP/musl-toolchain-unpack"
            rm -rf "$archive" "$unpack" "$toolchain"
            mkdir -p "$unpack" "$toolchain"

            curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              --silent --show-error "$url" -o "$archive" || return 1
            case "$url" in
              *.tar.xz) tar -xJf "$archive" -C "$unpack" || return 1 ;;
              *.tgz|*.tar.gz) tar -xzf "$archive" -C "$unpack" || return 1 ;;
              *) tar -xf "$archive" -C "$unpack" || return 1 ;;
            esac

            first_dir="$(find "$unpack" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$first_dir" ] && [ -d "$first_dir/bin" ]; then
              cp -a "$first_dir"/. "$toolchain"/ || return 1
            else
              cp -a "$unpack"/. "$toolchain"/ || return 1
            fi

            has_toolchain
          }

          if ! has_toolchain; then
            rm -rf "$toolchain"
            for url in "$MUSL_TOOLCHAIN_PRIMARY_URL" "$MUSL_TOOLCHAIN_FALLBACK_URL"; do
              echo "Installing musl toolchain from $url"
              if unpack_toolchain "$url"; then
                break
              fi
              echo "warning: failed to install musl toolchain from $url" >&2
            done
          fi

          if ! has_toolchain; then
            echo "aarch64 musl toolchain install failed" >&2
            exit 1
          fi
          chmod -R u+w "$toolchain"
          chmod u+rwx "$toolchain" "$toolchain/bin"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

          for tool in gcc g++ cpp ar as ld ranlib strip objcopy objdump readelf nm size strings; do
            unknown="$toolchain/bin/aarch64-unknown-linux-musl-$tool"
            linux="$toolchain/bin/aarch64-linux-musl-$tool"
            if [ ! -e "$unknown" ] && [ -x "$linux" ]; then
              ln -s "aarch64-linux-musl-$tool" "$unknown"
            fi
            if [ ! -e "$linux" ] && [ -x "$unknown" ]; then
              ln -s "aarch64-unknown-linux-musl-$tool" "$linux"
            fi
          done
          test -x "$toolchain/bin/aarch64-unknown-linux-musl-gcc"

          sudo mkdir -p /run/current-system/sw/bin
          for tool in ar ranlib strip; do
            sudo ln -sf "$toolchain/bin/aarch64-unknown-linux-musl-$tool" \
              "/run/current-system/sw/bin/aarch64-unknown-linux-musl-$tool"
          done

      - name: Compute userland build cache key
        if: steps.release_gate.outputs.should_release == 'true'
        id: userland_cache_key
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'musl-primary=%s\n' "$MUSL_TOOLCHAIN_PRIMARY_URL"
            printf 'musl-fallback=%s\n' "$MUSL_TOOLCHAIN_FALLBACK_URL"
            aarch64-unknown-linux-musl-gcc --version | sed -n '1p'
            git submodule status --recursive
            find userland -type f \( \
              -name meson.build -o \
              -name build.sh -o \
              -name '*.patch' -o \
              -name '*.src' -o \
              -name '*.ini' \
            \) -print | sort | while IFS= read -r file; do
              sha256sum "$file"
            done
            sha256sum meson.build
          } > "$RUNNER_TEMP/userland-cache-inputs"
          hash="$(sha256sum "$RUNNER_TEMP/userland-cache-inputs" | cut -d' ' -f1)"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore userland build cache
        if: steps.release_gate.outputs.should_release == 'true'
        id: userland_cache
        uses: actions/cache/restore@v5
        with:
          path: .ci-cache/userland-build
          key: ${{ runner.os }}-spore-userland-${{ steps.userland_cache_key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-spore-userland-

      - name: Configure Meson
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: meson setup build

      - name: Hydrate cached userland build outputs
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .ci-cache/userland-build ]; then
            mkdir -p build/userland
            cp -a .ci-cache/userland-build/. build/userland/
          fi

      - name: Build release artifacts
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          meson compile -C build image.img test_image.img spore-run
          meson test -C build --print-errorlogs

      - name: Refresh userland build cache
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-cache/userland-build
          mkdir -p .ci-cache/userland-build
          if [ -d build/userland ]; then
            cp -a build/userland/. .ci-cache/userland-build/
          fi
          du -sh .ci-cache/userland-build || true

      - name: Save userland build cache
        if: steps.release_gate.outputs.should_release == 'true' && steps.userland_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .ci-cache/userland-build
          key: ${{ runner.os }}-spore-userland-${{ steps.userland_cache_key.outputs.hash }}

      - name: Package artifacts
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mkdir -p dist
          cp build/image.img "dist/spore-$version-image.img"
          cp build/root.ext2 "dist/spore-$version-root.ext2"
          cp build/test_image.img "dist/spore-$version-test-image.img"
          cp build/test_root.ext2 "dist/spore-$version-test-root.ext2"
          cp build/tools/spore-run "dist/spore-$version-spore-run-linux-x86_64"
          chmod +x "dist/spore-$version-spore-run-linux-x86_64"
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create tag and GitHub release
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          tag='${{ steps.version.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Spore $version"
          git push origin "$tag"
          gh release create "$tag" dist/* \
            --title "Spore $version" \
            --notes "Automated release for Meson project version $version. Built from commit $GITHUB_SHA."
