name: release

on:
  push:
    branches:
      - master
      - main
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      MUSL_TOOLCHAIN_PRIMARY_URL: https://github.com/cross-tools/musl-cross/releases/download/20260515/aarch64-unknown-linux-musl.tar.xz
      MUSL_TOOLCHAIN_FALLBACK_URL: https://musl.cc/aarch64-linux-musl-cross.tgz
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read workspace version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^\[workspace\.package\]/ {workspace=1; next} /^\[/ {workspace=0} workspace && /^version = "/ {print $2}' Cargo.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this is a version bump
        id: release_gate
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          version='${{ steps.version.outputs.version }}'
          git fetch --force --tags origin '+refs/tags/*:refs/tags/*'
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; no release to create."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ '${{ github.event_name }}' = 'push' ]; then
            before='${{ github.event.before }}'
            if ! git cat-file -e "$before:Cargo.toml" 2>/dev/null; then
              echo "Initial workspace manifest; no version bump to release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            else
              previous="$(git show "$before:Cargo.toml" | awk -F'"' '/^\[workspace\.package\]/ {workspace=1; next} /^\[/ {workspace=0} workspace && /^version = "/ {print $2}')"
              if [ "$previous" = "$version" ]; then
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Install host dependencies
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-21 main" |
            sudo tee /etc/apt/sources.list.d/llvm-21.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential ca-certificates clang-21 cmake curl dosfstools \
            e2fsprogs file gettext git libarchive-tools lld-21 llvm-21 make mtools perl pkg-config \
            python3 qemu-system-arm xz-utils zip zstd
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"

      - name: Install Rust for the host, kernel and guest
        if: steps.release_gate.outputs.should_release == 'true'
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target aarch64-unknown-none-softfloat,aarch64-unknown-linux-musl,x86_64-unknown-none,riscv64gc-unknown-none-elf
          echo "RUSTUP_TOOLCHAIN=1.100.0" >> "$GITHUB_ENV"

      - name: Check out submodules
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      - name: Restore musl toolchain cache
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/cache@v5
        with:
          path: .ci-cache/musl
          key: ${{ runner.os }}-aarch64-musl-cross-v2

      - name: Install aarch64 musl cross toolchain
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$GITHUB_WORKSPACE/.ci-cache/musl"

          has_toolchain() {
            [ -x "$toolchain/bin/aarch64-unknown-linux-musl-gcc" ] ||
              [ -x "$toolchain/bin/aarch64-linux-musl-gcc" ]
          }

          unpack_toolchain() {
            url="$1"
            archive="$RUNNER_TEMP/musl-toolchain.archive"
            unpack="$RUNNER_TEMP/musl-toolchain-unpack"
            rm -rf "$archive" "$unpack" "$toolchain"
            mkdir -p "$unpack" "$toolchain"

            curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 20 --max-time 180 \
              --silent --show-error "$url" -o "$archive" || return 1
            case "$url" in
              *.tar.xz) tar -xJf "$archive" -C "$unpack" || return 1 ;;
              *.tgz|*.tar.gz) tar -xzf "$archive" -C "$unpack" || return 1 ;;
              *) tar -xf "$archive" -C "$unpack" || return 1 ;;
            esac

            first_dir="$(find "$unpack" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
            if [ -n "$first_dir" ] && [ -d "$first_dir/bin" ]; then
              cp -a "$first_dir"/. "$toolchain"/ || return 1
            else
              cp -a "$unpack"/. "$toolchain"/ || return 1
            fi

            has_toolchain
          }

          if ! has_toolchain; then
            rm -rf "$toolchain"
            for url in "$MUSL_TOOLCHAIN_PRIMARY_URL" "$MUSL_TOOLCHAIN_FALLBACK_URL"; do
              echo "Installing musl toolchain from $url"
              if unpack_toolchain "$url"; then
                break
              fi
              echo "warning: failed to install musl toolchain from $url" >&2
            done
          fi

          if ! has_toolchain; then
            echo "aarch64 musl toolchain install failed" >&2
            exit 1
          fi
          chmod -R u+w "$toolchain"
          chmod u+rwx "$toolchain" "$toolchain/bin"
          echo "$toolchain/bin" >> "$GITHUB_PATH"

          for tool in gcc g++ cpp ar as ld ranlib strip objcopy objdump readelf nm size strings; do
            unknown="$toolchain/bin/aarch64-unknown-linux-musl-$tool"
            linux="$toolchain/bin/aarch64-linux-musl-$tool"
            if [ ! -e "$unknown" ] && [ -x "$linux" ]; then
              ln -s "aarch64-linux-musl-$tool" "$unknown"
            fi
            if [ ! -e "$linux" ] && [ -x "$unknown" ]; then
              ln -s "aarch64-unknown-linux-musl-$tool" "$linux"
            fi
          done
          test -x "$toolchain/bin/aarch64-unknown-linux-musl-gcc"

      - name: Cache pinned downloads
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/cache@v5
        with:
          path: .cache/packages
          key: ${{ runner.os }}-downloads-${{ hashFiles('userland/prebuilt/packages.json', 'kernel/build.rs') }}

      - name: Build and test release
        env:
          CC: clang-21
        if: steps.release_gate.outputs.should_release == 'true'
        run: |
          cargo build --release --locked --features userland
          ./target/release/spore build --userland
          ./target/release/spore build --tests
          ./target/release/spore test host

      - name: Package artifacts
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mkdir -p dist
          cp target/release/image.img "dist/spore-$version-image.img"
          cp target/release/root.ext2 "dist/spore-$version-root.ext2"
          cp target/release/test_image.img "dist/spore-$version-test-image.img"
          cp target/release/test_root.ext2 "dist/spore-$version-test-root.ext2"
          tar -czf "dist/spore-$version-cli-linux-x86_64.tar.gz" -C target/release spore -C "$GITHUB_WORKSPACE" LICENSE.md boot/LIMINE-LICENSE
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create tag and GitHub release
        if: steps.release_gate.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          tag='${{ steps.version.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Spore $version"
          git push origin "$tag"
          gh release create "$tag" dist/* \
            --title "Spore $version" \
            --notes "Automated release for Cargo workspace version $version. Built from commit $GITHUB_SHA."
