<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spore · ARM64 runner</title>
  <link rel="stylesheet" href="./xterm/xterm.css" />
  <style>
    :root {
      color-scheme: dark;
      font:
        16px/1.5 "DM Sans",
        system-ui,
        sans-serif;
      background: #121713;
      color: #ecf3eb;
    }
    main {
      max-width: 70rem;
      margin: 6vh auto;
      padding: 1.25rem;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: -0.04em;
    }
    label {
      display: block;
      margin: 1rem 0;
    }
    input,
    textarea {
      display: block;
      margin-top: 0.35rem;
    }
    textarea {
      box-sizing: border-box;
      width: 100%;
      background: #0c100d;
      color: inherit;
      border: 1px solid #455348;
      border-radius: 0.3rem;
      padding: 0.8rem;
    }
    button {
      font: inherit;
      padding: 0.4rem 1.3rem;
      border: 1px solid #779280;
      border-radius: 0.3rem;
    }
    #output {
      height: clamp(20rem, 55vh, 45rem);
      padding: .5rem;
      background: #101311;
    }
  </style>
  <main>
    <h1>Spore ARM64 runner</h1>
    <form>
      <label>AArch64 ELF or packaged app (omit to boot the disk)<input id="elf" type="file" /></label>
      <label>ext2 or ext2+ disk<input id="disk" type="file" /></label>
      <label
        >ELF arguments (one per line)<textarea id="args" rows="3" spellcheck="false"></textarea>
      </label>
      <label><input id="persist" type="checkbox" style="display:inline"> Keep disk changes in this browser</label>
      <label>Guest CPUs<input id="cpus" type="number" min="1" max="64" value="1" required /></label>
      <label>Guest RAM (MiB)<input id="memory" type="number" min="16" max="2047" value="64" required /></label>
      <button id="run">Run</button> <button type="button" id="stop" disabled>Stop</button>
    </form>
    <p role="status" id="status"></p>
    <div id="output" aria-label="Guest terminal"></div>
  </main>
  <script type="module">
    import { Terminal } from "./xterm/xterm.mjs";
    import { FitAddon } from "./fit/addon-fit.mjs";

    const get = (id) => document.getElementById(id);
    let worker;
    const terminal = new Terminal({ cursorBlink: true, theme: { background: "#101311" } });
    const fit = new FitAddon();
    terminal.loadAddon(fit);
    terminal.open(get("output"));
    const observer = new ResizeObserver(() => fit.fit());
    observer.observe(get("output"));
    terminal.onData(input => worker?.postMessage({ input }));
    terminal.onResize(({rows, cols}) => worker?.postMessage({ size: {rows, cols} }));
    function finish(status) {
      worker.terminate();
      worker = null;
      get("run").disabled = false;
      get("stop").disabled = true;
      get("status").textContent = status;
    }
    document.querySelector("form").onsubmit = (event) => {
      event.preventDefault();
      const elf = get("elf").files[0], disk = get("disk").files[0];
      if (!elf && !disk) {
        get("status").textContent = "Select an executable or a root disk.";
        return;
      }
      terminal.reset();
      terminal.clear();
      fit.fit();
      terminal.focus();
      get("run").disabled = true;
      get("stop").disabled = false;
      get("status").textContent = "Running";
      worker = new Worker("./worker.mjs", { type: "module" });
      worker.onerror = (event) => finish(event.message || "Worker failed to start");
      worker.onmessage = ({ data }) => {
        if (data.bytes) {
          terminal.write(data.bytes);
        } else {
          finish(data.status);
        }
      };
      const args = get("args").value;
      worker.postMessage({
        elf, disk, online: new URLSearchParams(location.search).has("net"), persist: get("persist").checked, initialSize: {rows: terminal.rows, cols: terminal.cols}, cpuCount: get("cpus").valueAsNumber, memoryMiB: get("memory").valueAsNumber,
        args: args ? args.split("\n") : [],
      });
    };
    get("stop").onclick = () => {
      get("stop").disabled = true;
      worker.postMessage({ stop: true });
    };
  </script>
</html>
