<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spore · ARM64 runner</title>
  <style>
    :root {
      color-scheme: dark;
      font:
        16px/1.5 "DM Sans",
        system-ui,
        sans-serif;
      background: #121713;
      color: #ecf3eb;
    }
    main {
      max-width: 46rem;
      margin: 6vh auto;
      padding: 1.25rem;
    }
    h1 {
      font-size: 2rem;
      letter-spacing: -0.04em;
    }
    label {
      display: block;
      margin: 1rem 0;
    }
    input,
    textarea {
      display: block;
      margin-top: 0.35rem;
    }
    textarea,
    pre {
      box-sizing: border-box;
      width: 100%;
      background: #0c100d;
      color: inherit;
      border: 1px solid #455348;
      border-radius: 0.3rem;
      padding: 0.8rem;
    }
    button {
      font: inherit;
      padding: 0.4rem 1.3rem;
      border: 1px solid #779280;
      border-radius: 0.3rem;
    }
    pre {
      min-height: 10rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
  <main>
    <h1>Spore ARM64 runner</h1>
    <form>
      <label>Static AArch64 ELF or packaged app<input id="elf" type="file" required /></label>
      <label>Read-only ext2 or ext2+ disk (optional)<input id="disk" type="file" /></label>
      <label
        >ELF arguments (one per line)<textarea id="args" rows="3" spellcheck="false"></textarea>
      </label>
      <button id="run">Run</button> <button type="button" id="stop" disabled>Stop</button>
    </form>
    <p role="status" id="status"></p>
    <pre id="output" aria-label="Program output"></pre>
  </main>
  <script type="module">
    const get = (id) => document.getElementById(id);
    let worker;
    function finish(status) {
      worker.terminate();
      worker = null;
      get("run").disabled = false;
      get("stop").disabled = true;
      get("status").textContent = status;
    }
    document.querySelector("form").onsubmit = (event) => {
      event.preventDefault();
      const decoders = { 1: new TextDecoder(), 2: new TextDecoder() };
      const output = get("output");
      output.replaceChildren();
      get("run").disabled = true;
      get("stop").disabled = false;
      get("status").textContent = "Running";
      worker = new Worker("./worker.mjs", { type: "module" });
      worker.onerror = (event) => finish(event.message || "Worker failed to start");
      worker.onmessage = ({ data }) => {
        if (data.bytes) {
          output.append(decoders[data.fd].decode(data.bytes, { stream: true }));
        } else {
          for (const decoder of Object.values(decoders)) output.append(decoder.decode());
          finish(data.status);
        }
      };
      const args = get("args").value;
      worker.postMessage({
        elf: get("elf").files[0],
        disk: get("disk").files[0],
        args: args ? args.split("\n") : [],
      });
    };
    get("stop").onclick = () => finish("Stopped");
  </script>
</html>
