<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spore</title>
  <style>
    :root {
      color-scheme: dark;
      background: #101311;
    }
    body {
      margin: 0;
    }
    #terminal {
      position: fixed;
      inset: 8px;
    }
  </style>
  <main id="terminal" aria-label="Spore terminal"></main>
  <script type="module">
    const site = new URL("./", location.href);
    try {
      const response = await fetch(new URL("release.json", site), { cache: "no-store" });
      let release = null;
      if (response.ok) {
        release = await response.json();
        if (
          release.format !== 1 ||
          !/^[a-f0-9]{64}$/.test(release.id) ||
          !/^[a-f0-9]{64}$/.test(release.disk)
        )
          throw Error("Invalid Spore release manifest");
      } else if (response.status !== 404)
        throw Error("Cannot check the Spore release (" + response.status + ")");
      const assets = release ? new URL("releases/" + release.id + "/", site) : site;
      const style = document.createElement("link");
      style.rel = "stylesheet";
      style.href = new URL("xterm/xterm.css", assets);
      const loaded = new Promise((resolve, reject) => {
        style.onload = resolve;
        style.onerror = () => reject(Error("Cannot load terminal styles"));
      });
      document.head.append(style);
      const [runner] = await Promise.all([import(new URL("terminal.mjs", assets)), loaded]);
      runner.start(site.href, release);
    } catch (error) {
      document.querySelector("main").textContent = error.message;
    }
  </script>
</html>
