[package]
name = "spore-wasm"
version.workspace = true
edition = "2024"
publish = false

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
spore-build = { path = "../../../tools/build" }

[target.wasm32-unknown-unknown.dependencies]
aes = { version = "0.9", features = ["hazmat"] }
rustc_apfloat = "0.2.3"
